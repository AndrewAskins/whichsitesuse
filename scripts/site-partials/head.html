  <script>
    // Theme follows the visitor's system setting. ?theme=light|dark forces one for this page view only (for checking both).
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "light" || q === "dark") document.documentElement.setAttribute("data-theme", q);
      } catch (e) {}
    })();
  </script>
